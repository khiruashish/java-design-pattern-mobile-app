name: App
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: App content is in sync with docs/
        working-directory: .
        run: |
          python tools/build_app_content.py
          git diff --exit-code -- app/assets/content || (echo "Run: python3 tools/build_app_content.py" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: java-patterns-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
